name: Build and deploy Leptos preview

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-unknown-unknown
          components: rustfmt
      - uses: Swatinem/rust-cache@v2
      - name: Check formatting
        run: cargo fmt --all -- --check
      - name: Build deployment tools from Rust packages
        run: |
          cargo install trunk --version 0.21.14 --locked
          cargo install wasm-bindgen-cli --version 0.2.130 --locked
      - name: Install wasm-opt from Ubuntu
        run: |
          sudo apt-get update
          sudo apt-get install --yes binaryen
      - name: Build Rust and WebAssembly
        run: trunk build --release --locked --public-url ./
      - name: Upload website
        uses: actions/upload-pages-artifact@v3
        with:
          path: dist
  deploy:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Publish preview
        id: deployment
        uses: actions/deploy-pages@v4
