name: Build and deploy Leptos preview

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-unknown-unknown
          components: rustfmt
      - uses: Swatinem/rust-cache@v2
      - name: Check formatting
        run: cargo fmt --all -- --check
      - name: Install Trunk and wasm-bindgen
        uses: taiki-e/install-action@v2
        with:
          # Match wasm-bindgen to Cargo.lock; avoid Trunk's legacy download URL.
          tool: trunk@0.21.14,wasm-bindgen@0.2.130
      - name: Install wasm-opt with download retries
        working-directory: ${{ runner.temp }}
        run: |
          curl --fail --location --retry 5 --retry-delay 3 --max-time 180 \
            --output binaryen.tar.gz \
            https://github.com/WebAssembly/binaryen/releases/download/version_123/binaryen-version_123-x86_64-linux.tar.gz
          echo 'e959f2170af4c20c552e9de3a0253704d6a9d2766e8fdb88e4d6ac4bae9388fe  binaryen.tar.gz' | sha256sum --check
          mkdir binaryen
          tar -xzf binaryen.tar.gz -C binaryen --strip-components=1
          echo "$RUNNER_TEMP/binaryen/bin" >> "$GITHUB_PATH"
      - name: Build Rust and WebAssembly
        run: trunk build --release --locked --public-url ./
      - name: Upload website
        uses: actions/upload-pages-artifact@v3
        with:
          path: dist
  deploy:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Publish preview
        id: deployment
        uses: actions/deploy-pages@v4
